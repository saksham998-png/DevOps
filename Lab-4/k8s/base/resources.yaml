apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SECRETS_DIR: /etc/taskboard/secrets
  TRACK: stable
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
  labels: { app: taskboard }
spec:
  selector: { app: taskboard }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskboard
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: taskboard }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: taskboard
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: taskboard }
---
# Only the app may talk to Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-taskboard
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [taskboard, taskboard-bg, taskboard-canary] }
      ports:
        - { port: 6379 }
