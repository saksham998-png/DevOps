apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab4
labels:
  - pairs:
      app.kubernetes.io/part-of: taskboard-lab4
    includeSelectors: false
resources:
  - namespace.yaml
  - resources.yaml
  - redis.yaml
  - deployment.yaml
