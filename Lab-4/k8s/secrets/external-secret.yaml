# External Secrets Operator pulls the values from Vault and writes the Kubernetes
# Secret "taskboard-secrets". Only these references live in Git - never the values.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader          # Vault's kubernetes auth role "taskboard" trusts this SA only
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: taskboard
          serviceAccountRef:
            name: vault-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: taskboard-secrets
spec:
  refreshInterval: 1m          # rotate in Vault and pods see the new file within ~1-2 minutes
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: taskboard-secrets
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef: { key: lab4/taskboard, property: db_password }
    - secretKey: api_key
      remoteRef: { key: lab4/taskboard, property: api_key }
