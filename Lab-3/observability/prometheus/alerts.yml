groups:
  - name: taskboard
    rules:
      - alert: TaskboardDown
        expr: up{job="taskboard"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "taskboard is not being scraped" }

      - alert: TaskboardHighErrorRate
        expr: |
          sum(rate(taskboard_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(taskboard_http_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "more than 5% of requests are failing" }

      - alert: TaskboardSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(taskboard_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "p95 latency above 500ms" }
