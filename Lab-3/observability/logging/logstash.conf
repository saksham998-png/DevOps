input {
  beats { port => 5044 }
}

filter {
  # the app writes one JSON object per line; parse it into [app]
  json {
    source => "message"
    target => "app"
    skip_on_invalid_json => true
  }
  if [app][@timestamp] {
    date {
      match => ["[app][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
  mutate {
    add_field => { "pipeline" => "lab3-logging" }
    remove_field => ["[agent]", "[ecs]", "[input]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lab3-logs-%{+YYYY.MM.dd}"
  }
}
